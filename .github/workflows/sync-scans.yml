# Refresh data/scans.json from the Reasoning Traces API on a schedule.
# The bearer token lives in the repo's Actions secrets (TRACES_TOKEN) —
# it never appears in the page, the code, or the git history.
name: Sync scans
on:
  schedule:
    - cron: "17 3,15 * * *"   # twice a day, off the top of the hour
  workflow_dispatch: {}        # manual "Run workflow" button

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync from traces API
        env:
          TRACES_TOKEN: ${{ secrets.TRACES_TOKEN }}
        run: node scripts/sync-scans.mjs
      - name: Commit if changed
        run: |
          git config user.name "scan-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/scans.json
          git diff --cached --quiet || { git commit -m "sync scans from traces API"; git push; }
